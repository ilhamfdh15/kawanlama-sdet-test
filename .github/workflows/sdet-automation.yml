name: SDET Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright Browsers are Installed
        run: playwright install --with-deps

      - name: Run Pytest with Allure & HTML Reporting
        run: |
          pytest --html=report.html --self-contained-html --alluredir=allure-results
        env:
          CURA_BASE_URL: ${{ secrets.CURA_BASE_URL }}
          CURA_USERNAME: ${{ secrets.CURA_USERNAME }}
          CURA_PASSWORD: ${{ secrets.CURA_PASSWORD }}

      - name: Upload Pytest HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report.html

      - name: Publish Allure Report to GitHub Pages
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20