name: Playwright SDET Automation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # Upgraded: Automatically caches pip dependencies to speed up future runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-xdist # Added: Installs xdist for parallel execution if not in requirements.txt

      - name: Cache Playwright Browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/*requirements.txt') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium webkit

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium webkit

      - name: Run Pytest Test Suite
        env:
          CURA_USERNAME: ${{ secrets.CURA_USERNAME || 'John Doe' }}
          CURA_PASSWORD: ${{ secrets.CURA_PASSWORD || 'ThisIsNotAPassword' }}
        # Upgraded: Added '-n auto' for parallel execution and '--tracing' for debugging CI failures
        run: pytest -n auto --browser chromium --browser webkit --tracing=retain-on-failure --html=report.html --self-contained-html

      - name: Upload Test Report & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            report.html
            test-results/
          retention-days: 7